<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Experiments</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Inter:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Components/shared/base.css">
  <link rel="stylesheet" href="Components/ControlPanel/component.css">
  <link rel="stylesheet" href="Components/DimensionControl/component.css">
  <link rel="stylesheet" href="Components/ColorInput/component.css">
  <link rel="stylesheet" href="Components/SnippetOutput/component.css">
  <link rel="stylesheet" href="Components/OptionSelector/component.css">
  <link rel="stylesheet" href="Components/HoverButton/component.css">
  <link rel="stylesheet" href="Components/RotateXButton/component.css">
  <link rel="stylesheet" href="Components/RotateCarousel/component.css">
  <link rel="stylesheet" href="Components/RotateXCarousel/component.css">
  <link rel="stylesheet" href="Components/FlipCarousel/component.css">
  <link rel="stylesheet" href="Components/ArcScrollTransition/component.css">
  <link rel="stylesheet" href="Components/InfiniteCarousel/component.css">
  <link rel="stylesheet" href="Components/HorizontalParallax/component.css">
  <link rel="stylesheet" href="Components/StaggerTextButton/component.css">
  <link rel="stylesheet" href="Components/HeadingEntrance/component.css">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Satoshi:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      background: #fff;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <script src="experiments-shell-embed.js"></script>
  <script src="Components/components-templates.js"></script>
  <script src="Components/control-panel-kit.js"></script>
  <script>
    (async () => {
      const shell = window.EXPERIMENTS_SHELL_HTML;
      if (!shell) {
        throw new Error('Missing experiments-shell-embed.js. Run: node scripts/build-single-html.js');
      }
      document.body.insertAdjacentHTML('afterbegin', shell);

      await ControlPanelKit.load();
      await ControlPanelKit.loadScript('HoverButton/component.js', 'hover-button');
      await ControlPanelKit.loadScript('RotateXButton/component.js', 'button-rotate-x');
      await ControlPanelKit.loadScript('RotateCarousel/component.js', 'rotate-carousel');
      await ControlPanelKit.loadScript('RotateXCarousel/component.js', 'rotate-x-carousel');
      await ControlPanelKit.loadScript('FlipCarousel/component.js', 'flip-carousel');
      await ControlPanelKit.loadScript('ArcScrollTransition/component.js', 'arc-scroll-transition');
      await ControlPanelKit.loadScript('InfiniteCarousel/component.js', 'infinite-carousel');
      await ControlPanelKit.loadScript('HorizontalParallax/component.js', 'horizontal-parallax');
      await ControlPanelKit.loadScript('StaggerTextButton/component.js', 'button-stagger-text');
      await ControlPanelKit.loadScript('HeadingEntrance/component.js', 'heading-entrance');
      await ControlPanelKit.loadScript('../button-hover-app.js', 'button-hover');
      await ControlPanelKit.loadScript('../button-rotate-x-app.js', 'button-rotate-x');
      await ControlPanelKit.loadScript('../carousel-rotate-app.js', 'carousel-rotate');
      await ControlPanelKit.loadScript('../carousel-rotate-x-app.js', 'carousel-rotate-x');
      await ControlPanelKit.loadScript('../carousel-flip-app.js', 'carousel-flip');
      await ControlPanelKit.loadScript('../transition-arc-scroll-snippet-embed.js', 'transition-arc-scroll-snippet-embed');
      await ControlPanelKit.loadScript('../transition-arc-scroll-app.js', 'transition-arc-scroll');
      await ControlPanelKit.loadScript('../carousel-infinite-snippet-embed.js', 'carousel-infinite-snippet-embed');
      await ControlPanelKit.loadScript('../carousel-infinite-app.js', 'carousel-infinite');
      await ControlPanelKit.loadScript('../parallax-horizontal-app.js', 'parallax-horizontal');
      await ControlPanelKit.loadScript('../button-stagger-text-snippet-embed.js', 'button-stagger-text-snippet-embed');
      await ControlPanelKit.loadScript('../button-stagger-text-app.js', 'button-stagger-text');
      await ControlPanelKit.loadScript('../heading-entrance-snippet-embed.js', 'heading-entrance-snippet-embed');
      await ControlPanelKit.loadScript('../heading-entrance-app.js', 'heading-entrance');
      await ControlPanelKit.loadScript('../experiments-app.js', 'experiments');
    })().catch((error) => {
      console.error(error);
      document.body.innerHTML = `<p style="padding:24px;font:500 14px Inter,sans-serif;">Failed to load experiments.<br><code>${error.message}</code></p>`;
    });
  </script>
</body>
</html>
