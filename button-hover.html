<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Hover Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&family=Inter:wght@500&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      background: #fff;
      overflow: hidden;
    }

*, *::before, *::after { box-sizing: border-box; }

.field {
  width: 240px;
  padding: 0 16px;
  margin-bottom: 16px;
}

.field-label {
  display: block;
  margin-bottom: 8px;
  font-size: 9px;
  font-weight: 500;
  line-height: 14px;
  letter-spacing: 0.27px;
  color: rgba(0, 0, 0, 0.5);
  text-transform: capitalize;
}

.row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.row + .row { margin-top: 8px; }

.field-stack {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.input-wrap {
  flex: 1;
  min-width: 0;
  height: 24px;
  display: flex;
  align-items: center;
  background: #f5f5f5;
  border: 1px solid transparent;
  border-radius: 5px;
  overflow: hidden;
}

.input-wrap:focus-within {
  border-color: #9D9D9D;
}

.input-icon {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 500;
  color: rgba(0, 0, 0, 0.5);
}

.input-icon img {
  width: 12px;
  height: 12px;
  display: block;
  opacity: 0.5;
}

.input-icon--wide img {
  width: 14px;
  height: auto;
  max-height: 16px;
}

.input-wrap--label {
  padding: 0 7px;
}

.input-icon:has(img) {
  padding: 6px;
}

.input-wrap input {
  flex: 1;
  min-width: 0;
  height: 100%;
  border: none;
  background: transparent;
  padding: 0;
  font: 500 11px/16px Inter, sans-serif;
  letter-spacing: 0.055px;
  color: #09090b;
  outline: none;
}

/* No leading icon: inset the text like .input-wrap--label does. */
.input-wrap:not(.input-wrap--label) > input:first-child {
  padding-left: 7px;
}

.suffix-wrap {
  width: 30px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 7px;
}

.suffix-wrap span {
  font: 500 11px/16px Inter, sans-serif;
  color: #09090b;
}

/* ---- Upload shared (FileUpload, ImageUpload, MultiImageUpload) ---- */
.upload-file-input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}

.upload-remove,
.upload-clear {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
  padding: 0;
  border: none;
  background: transparent;
  border-radius: 5px;
  cursor: pointer;
}

.upload-remove img,
.upload-clear img {
  width: 8px;
  height: 8px;
  display: block;
  opacity: 0.5;
}

.upload-clear:hover { background: rgba(0, 0, 0, 0.04); }

.upload-remove:focus,
.upload-clear:focus { outline: none; }

.upload-remove:focus-visible,
.upload-clear:focus-visible {
  outline: 1px solid #9d9d9d;
  outline-offset: 1px;
}

.upload-meta {
  flex-shrink: 0;
  font: 500 11px/16px Inter, sans-serif;
  letter-spacing: 0.055px;
  color: rgba(0, 0, 0, 0.5);
}

.upload-clear[hidden] {
  display: none;
}

.cp-app {
  display: flex;
  height: 100%;
  min-height: 480px;
  background: #fff;
  border: 1px solid #eee;
  border-radius: 12px;
  overflow: hidden;
}

.cp-preview-area {
  flex: 1;
  display: flex;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
}

.cp-preview-area > .cp-preview {
  flex: 1;
  width: 100%;
}

.cp-preview-area > .cp-preview[hidden] {
  display: none !important;
}

.cp-preview {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  background: #fff;
}

.cp-preview-box {
  font: 500 14px/1 Inter, sans-serif;
  color: #09090b;
  text-align: center;
  box-sizing: border-box;
}

.panel {
  width: 241px;
  flex-shrink: 0;
  height: 100%;
  overflow-y: auto;
  padding: 16px 0;
  background: #fff;
  border-left: 1px solid #eee;
}

.cp-app--fullscreen {
  height: 100vh;
  border: none;
  border-radius: 0;
}

.cp-app--fullscreen .panel {
  height: 100vh;
}

.panel [data-experiment-panel][hidden] {
  display: none !important;
}

.panel [data-exp-transition-arc-scroll-pos-x][hidden],
.panel [data-exp-transition-arc-scroll-pos-group][hidden],
.panel [data-exp-transition-arc-scroll-burst-group][hidden] {
  display: none !important;
}


/* Mobile: preview on top (40% of the screen), panel scrolls below. */
@media (max-width: 768px) {
  .cp-app {
    flex-direction: column;
  }

  .cp-app--fullscreen {
    height: 100vh;
    height: 100dvh;
    min-height: 0;
    /* Keep content clear of Safari's blurred top bar. */
    padding-top: 32px;
  }

  .cp-preview-area {
    flex: 0 0 40vh;
    flex-basis: 40dvh;
  }

  /* Previews use real sizes; render them at 80% so they fit a phone.
     zoom (not transform) keeps full-bleed previews filling the area. */
  .cp-preview-area > .cp-preview {
    zoom: 0.8;
  }

  .panel,
  .cp-app--fullscreen .panel {
    width: 100%;
    flex: 1 1 auto;
    height: auto;
    min-height: 0;
    border-left: none;
    border-top: 1px solid #eee;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
  }

  .panel .field {
    width: 100%;
  }
}

.chevron-wrap {
  width: 21px;
  height: 24px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 7px;
  background: transparent;
}

.chevron-wrap:hover {
  background: rgba(0, 0, 0, 0.04);
  border-radius: 5px;
}

.chevron-wrap img {
  width: 8px;
  height: auto;
  opacity: 0.5;
}

.input-wrap--dimension {
  position: relative;
  overflow: visible;
  z-index: 1;
}

.input-wrap--dimension.is-menu-open {
  z-index: 30;
}

.dimension-control {
  flex: 1;
  min-width: 0;
  height: 100%;
  display: flex;
  align-items: center;
}

.dimension-mode-label {
  flex: 1;
  min-width: 0;
  padding: 0;
  font: 500 11px/16px Inter, sans-serif;
  letter-spacing: 0.055px;
  color: #09090b;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  user-select: none;
}

.dimension-control.is-fixed .dimension-mode-label {
  display: none;
}

.dimension-control:not(.is-fixed) .dimension-fixed-input {
  display: none;
}

.dimension-control.is-fixed .dimension-fixed-input:disabled {
  opacity: 1;
}

.dimension-chevron {
  cursor: pointer;
}

.dimension-menu {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  z-index: 40;
  padding: 2px;
  background: #000;
  border: 1px solid rgba(0, 0, 0, 0.08);
  border-radius: 8px;
  box-shadow: 0 2px 2px rgba(0, 0, 0, 0.15);
  overflow: hidden;
}

.dimension-menu.is-open {
  display: block;
}

.dimension-menu button {
  width: 100%;
  height: 24px;
  border: none;
  background: transparent;
  padding: 0 6px;
  font: 500 11px/16px Inter, sans-serif;
  letter-spacing: 0.055px;
  color: #fff;
  text-align: left;
  border-radius: 5px;
  cursor: pointer;
}

.dimension-menu button:hover,
.dimension-menu button.is-active {
  background: rgba(245, 245, 245, 0.18);
}

.color-wrap {
  padding: 2px 0;
}

.swatch {
  width: 14px;
  height: 14px;
  margin: 5px;
  border-radius: 2px;
  flex-shrink: 0;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);
}

.opacity-wrap {
  width: 57px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 2px;
  padding: 0 8px;
}

.opacity-wrap input {
  width: 22px;
  padding: 0;
  text-align: right;
}

.opacity-suffix {
  font: 500 11px/16px Inter, sans-serif;
  color: rgba(0, 0, 0, 0.5);
}

.color-preview {
  width: 100%;
  height: 40px;
  margin-top: 8px;
  border-radius: 5px;
  border: 1px solid rgba(0, 0, 0, 0.08);
}

.color-selector__wrap {
  position: relative;
  overflow: visible;
  z-index: 1;
}

.color-selector__wrap.is-menu-open { z-index: 30; }

.color-selector__trigger {
  flex-shrink: 0;
  display: flex;
  margin: 0;
  padding: 0;
  border: none;
  background: transparent;
  border-radius: 2px;
  cursor: pointer;
}

.color-selector__trigger:focus { outline: none; }

.color-selector__trigger:focus-visible .swatch {
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08), 0 0 0 1px #9d9d9d;
}

.color-selector__popover {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  z-index: 40;
  padding: 8px;
  flex-direction: column;
  gap: 8px;
  background: #fff;
  border: 1px solid rgba(0, 0, 0, 0.08);
  border-radius: 8px;
  box-shadow: 0 2px 2px rgba(0, 0, 0, 0.15);
}

.color-selector__popover.is-open { display: flex; }

.color-selector__sv {
  position: relative;
  width: 100%;
  height: 120px;
  border-radius: 5px;
  background-image:
    linear-gradient(to top, #000, rgba(0, 0, 0, 0)),
    linear-gradient(to right, #fff, rgba(255, 255, 255, 0));
  cursor: crosshair;
  touch-action: none;
}

.color-selector__hue,
.color-selector__alpha {
  position: relative;
  width: 100%;
  height: 12px;
  border-radius: 5px;
  cursor: pointer;
  touch-action: none;
}

.color-selector__hue {
  background: linear-gradient(90deg, #f00 0%, #ff0 16.67%, #0f0 33.33%, #0ff 50%, #00f 66.67%, #f0f 83.33%, #f00 100%);
}

.color-selector__alpha {
  background-color: #fff;
  background-image:
    linear-gradient(45deg, #d9d9d9 25%, transparent 25%, transparent 75%, #d9d9d9 75%),
    linear-gradient(45deg, #d9d9d9 25%, transparent 25%, transparent 75%, #d9d9d9 75%);
  background-size: 8px 8px;
  background-position: 0 0, 4px 4px;
}

.color-selector__alpha-fill {
  position: absolute;
  inset: 0;
  border-radius: 5px;
}

.color-selector__thumb {
  position: absolute;
  top: 50%;
  width: 12px;
  height: 12px;
  border: 2px solid #fff;
  border-radius: 50%;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.1);
  transform: translate(-50%, -50%);
  pointer-events: none;
}

.color-selector__sv .color-selector__thumb { top: 0; }

.color-selector__sv:focus,
.color-selector__hue:focus,
.color-selector__alpha:focus { outline: none; }

.color-selector__sv:focus-visible,
.color-selector__hue:focus-visible,
.color-selector__alpha:focus-visible {
  outline: 1px solid #9d9d9d;
  outline-offset: 1px;
}

.color-selector__hsb {
  display: flex;
  gap: 8px;
}

.color-selector__hsb .input-wrap {
  flex: 1;
  min-width: 0;
}

.color-selector__hsb .input-icon {
  width: 20px;
}

.color-selector__eyedropper {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0;
  padding: 0;
  border: 1px solid transparent;
  border-radius: 5px;
  background: #f5f5f5;
  cursor: pointer;
}

.color-selector__eyedropper img {
  width: 12px;
  height: 12px;
  display: block;
  opacity: 0.5;
}

.color-selector__eyedropper:hover { background: #eeeeee; }

.color-selector__eyedropper:focus { outline: none; }

.color-selector__eyedropper:focus-visible { border-color: #9D9D9D; }

.color-selector__eyedropper.is-active { background: #23272e; }

.color-selector__eyedropper.is-active img {
  opacity: 1;
  filter: invert(1);
}

.color-selector__eyedropper:disabled,
.color-selector__eyedropper.is-disabled {
  opacity: 0.5;
  cursor: default;
}

.color-selector__eyedropper:disabled:hover { background: #f5f5f5; }

.kit-tooltip {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 1000;
  max-width: 200px;
  padding: 4px 8px;
  background: #000;
  border-radius: 5px;
  box-shadow: 0 2px 2px rgba(0, 0, 0, 0.15);
  font: 500 11px/16px Inter, sans-serif;
  letter-spacing: 0.055px;
  color: #fff;
  pointer-events: none;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.12s ease, visibility 0s linear 0.12s;
}

.kit-tooltip.is-open {
  opacity: 1;
  visibility: visible;
  transition: opacity 0.12s ease;
}

.kit-tooltip::after {
  content: "";
  position: absolute;
  width: 0;
  height: 0;
  border: 4px solid transparent;
}

.kit-tooltip[data-placement="top"]::after {
  top: 100%;
  left: var(--kit-tooltip-arrow, 50%);
  margin-left: -4px;
  border-top-color: #000;
}

.kit-tooltip[data-placement="bottom"]::after {
  bottom: 100%;
  left: var(--kit-tooltip-arrow, 50%);
  margin-left: -4px;
  border-bottom-color: #000;
}

.kit-tooltip[data-placement="left"]::after {
  left: 100%;
  top: var(--kit-tooltip-arrow, 50%);
  margin-top: -4px;
  border-left-color: #000;
}

.kit-tooltip[data-placement="right"]::after {
  right: 100%;
  top: var(--kit-tooltip-arrow, 50%);
  margin-top: -4px;
  border-right-color: #000;
}

@media (prefers-reduced-motion: reduce) {
  .kit-tooltip,
  .kit-tooltip.is-open { transition: none; }
}

.cubic-bezier-field {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 16px;
}

.cubic-bezier-editor {
  width: 100%;
  height: 200px;
  flex-shrink: 0;
  overflow: hidden;
  touch-action: none;
}

.cubic-bezier-svg {
  display: block;
  width: 100%;
  height: 100%;
}

.cubic-bezier-guide {
  stroke: #000;
  stroke-opacity: 0.4;
  stroke-width: 2;
}

.cubic-bezier-curve {
  fill: none;
  stroke: #000;
  stroke-width: 3;
  stroke-linecap: round;
}

.cubic-bezier-handle-line {
  stroke: #4372FF;
  stroke-width: 3;
}

.cubic-bezier-handle {
  fill: #fff;
  stroke: #4372FF;
  stroke-width: 3;
  cursor: grab;
}

.cubic-bezier-handle:focus {
  outline: none;
  stroke: #2952CC;
}

.cubic-bezier-handle.is-dragging {
  cursor: grabbing;
}

.cubic-bezier-value-input input {
  padding: 0 7px 0 0;
}

.code-field { margin-bottom: 0; }

.snippet-output {
  width: 100%;
  height: 100px;
  min-height: 100px;
  padding: 3px 6px;
  border: none;
  border-radius: 5px;
  background: #f5f5f5;
  resize: none;
  outline: none;
  font: 500 9px/16px "DM Mono", monospace;
  letter-spacing: 0.055px;
  color: #09090b;
}

.download-btn {
  width: 100%;
  height: 24px;
  margin-top: 8px;
  border: 1px solid #e6e6e6;
  border-radius: 5px;
  background: #fff;
  font: 500 11px/16px Inter, sans-serif;
  letter-spacing: 0.055px;
  color: #09090b;
  cursor: pointer;
}

.download-btn:hover { background: #fafafa; }

#btn {
  font-family: Arial, sans-serif;
  font-size: 16px;
  font-weight: 400;
  line-height: 1;
  border: none;
  border-radius: 0;
  background: #f0f0f0;
  height: 56px;
  padding: 0 24px;
  cursor: pointer;
  overflow: hidden;
  color: #000;
}

.hover-button .label {
  display: block;
  position: relative;
  height: 1.125em;
}

.hover-button .text {
  display: block;
  will-change: transform;
  white-space: nowrap;
}

.hover-button .text.is-hidden {
  position: absolute;
  top: 0;
  left: 0;
}

  </style>
</head>
<body>
  <div class="cp-app cp-app--fullscreen">
    <div class="cp-preview">
      <button id="btn" class="hover-button" type="button">
        <span class="label">
          <span class="text">Hover here</span>
          <span class="text is-hidden">Hover here</span>
        </span>
      </button>
    </div>

    <aside class="panel">
      <div class="field">
        <label class="field-label" for="label-text">Text Label</label>
        <div class="row">
          <div class="input-wrap input-wrap--label">
            <input type="text" id="label-text" value="Hover here">
          </div>
        </div>
      </div>

      <div class="field">
        <span class="field-label">Dimensions</span>
        <div class="row">
          <div class="input-wrap input-wrap--dimension" data-dimension-id="width">
            <span class="input-icon">W</span>
            <div class="dimension-control">
              <span class="dimension-mode-label">Hug (0)</span>
              <input type="text" class="dimension-fixed-input" value="160">
            </div>
            <span class="chevron-wrap dimension-chevron" role="button" tabindex="0" aria-label="Width mode">
              <img src="" alt="" data-icon="chevron">
            </span>
            <div class="dimension-menu">
              <button type="button" data-dimension-mode="fixed">Fixed</button>
              <button type="button" data-dimension-mode="hug">Hug Content</button>
            </div>
          </div>
          <div class="input-wrap input-wrap--dimension" data-dimension-id="height">
            <span class="input-icon">H</span>
            <div class="dimension-control is-fixed">
              <span class="dimension-mode-label">Hug (0)</span>
              <input type="text" class="dimension-fixed-input" value="56">
            </div>
            <span class="chevron-wrap dimension-chevron" role="button" tabindex="0" aria-label="Height mode">
              <img src="" alt="" data-icon="chevron">
            </span>
            <div class="dimension-menu">
              <button type="button" data-dimension-mode="fixed">Fixed</button>
              <button type="button" data-dimension-mode="hug">Hug Content</button>
            </div>
          </div>
        </div>
      </div>

      <div class="field">
        <span class="field-label">Padding</span>

window.ComponentUtils = {
  parsePx(value, fallback) {
    const n = parseFloat(String(value).trim());
    return Number.isFinite(n) ? n : fallback;
  },

  parseMs(value, fallback) {
    return this.parsePx(value, fallback);
  },

  parseOpacity(value, fallback = 1) {
    const n = parseFloat(String(value).trim());
    if (!Number.isFinite(n)) return fallback;
    const opacity = n > 1 ? n / 100 : n;
    return Math.min(Math.max(opacity, 0), 1);
  },

  normalizeHex(value) {
    let hex = String(value).trim().replace(/^#/, '');
    if (/^[0-9a-fA-F]{3}$/.test(hex)) {
      hex = hex.split('').map((c) => c + c).join('');
    }
    return /^[0-9a-fA-F]{6}$/.test(hex) ? `#${hex.toUpperCase()}` : value.trim();
  },

  hexToRgba(hex, alpha) {
    let h = this.normalizeHex(hex).replace('#', '');
    if (h.length !== 6 || !/^[0-9a-fA-F]{6}$/.test(h)) return hex;

    const r = parseInt(h.slice(0, 2), 16);
    const g = parseInt(h.slice(2, 4), 16);
    const b = parseInt(h.slice(4, 6), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  },

  colorWithOpacity(colorValue, opacityValue) {
    const color = this.normalizeHex(colorValue);
    const opacity = this.parseOpacity(opacityValue, 1);

    if (!color) return `rgba(0, 0, 0, ${opacity})`;
    if (color.startsWith('rgba(') || color.startsWith('hsla(')) return color;
    if (color.startsWith('#')) return this.hexToRgba(color, opacity);
    if (color.startsWith('rgb(')) {
      return color.replace('rgb(', 'rgba(').replace(')', `, ${opacity})`);
    }

    return color;
  },

  escapeHtml(value) {
    return value
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  },

  bindInputBehavior(input) {
    if (!input || input.dataset.inputBehaviorBound) return;

    input.dataset.inputBehaviorBound = 'true';

    input.addEventListener('mousedown', (event) => {
      if (document.activeElement === input) {
        event.preventDefault();
      }
    });

    input.addEventListener('focus', () => {
      requestAnimationFrame(() => {
        if (document.activeElement !== input) return;
        input.select();
      });
    });
  },

  bindInputWrapInputs(root = document) {
    root.querySelectorAll('.input-wrap input').forEach((input) => {
      this.bindInputBehavior(input);
    });
  },

  // Binding the same input more than once (e.g. by a component and again by
  // the experiment app) shares one keydown handler, so each key press steps
  // once and every registered onChange still runs.
  // Step is 1 (Shift: 8) by default; set `options.step` or `data-arrow-step`
  // for fine-grained fields (e.g. 0.1 for scale, Shift steps 10×).
  bindNumericArrowKey(input, onChange, options = {}) {
    if (!input) return;

    let binding = input.__numericArrowKey;
    if (binding) {
      if (onChange) binding.handlers.push(onChange);
      if (options.isOpacity) binding.isOpacity = true;
      if (options.step != null) binding.step = options.step;
      return;
    }

    binding = {
      handlers: onChange ? [onChange] : [],
      isOpacity: !!options.isOpacity,
      step: options.step,
    };
    input.__numericArrowKey = binding;

    input.addEventListener('keydown', (event) => {
      if (event.key !== 'ArrowUp' && event.key !== 'ArrowDown') return;

      event.preventDefault();

      const raw = input.value.trim();
      const match = raw.match(/^(-?\d*\.?\d+)(.*)$/);
      if (!match) return;

      const base = Number(binding.step ?? input.dataset.arrowStep) || 1;
      const step = event.shiftKey ? (base === 1 ? 8 : base * 10) : base;
      const delta = event.key === 'ArrowUp' ? step : -step;

      let next = Math.round((parseFloat(match[1]) + delta) * 1e6) / 1e6;
      const suffix = match[2];

      if (binding.isOpacity) {
        next = Math.min(100, Math.max(0, next));

window.initSnippetOutput = function initSnippetOutput(root, options = {}) {
  const output = root.querySelector('[data-snippet-output]');
  const downloadBtn = root.querySelector('[data-snippet-download]');
  const getContent = options.getContent || (() => '');
  const filename = options.filename || 'snippet.html';

    if (output) output.value = getContent();
  }

  downloadBtn?.addEventListener('click', () => {
    const blob = new Blob([getContent()], { type: 'text/html;charset=utf-8' });

    element: root,
    output,

window.initHoverButton = function initHoverButton(root, options = {}) {
  const btn = root.querySelector('#btn') || root.querySelector('.hover-button') || root;
  const texts = btn.querySelectorAll('.text');
  const utils = window.ComponentUtils;

  let active = 0;
  let busy = false;
  let isHovered = false;

  let duration = options.duration ?? 350;
  let easingRaw = options.easingRaw ?? '0.7, 0, 0.25, 1';

    const raw = String(easingRaw).trim();

    const { travel } = getSlideMetrics();
    busy = false;
    active = 0;
    texts[0].classList.remove('is-hidden');
    texts[1].classList.add('is-hidden');
    setTransform(texts[0], 0, false);
    setTransform(texts[1], -travel, false);
  }

  function finishSlide(current, next, travel) {
    setTransform(current, -travel, false);
    current.classList.add('is-hidden');
    next.classList.remove('is-hidden');
    active = 1 - active;
    busy = false;
    if (!isHovered) reset();
  }

  function slide() {
    if (busy) return;
    busy = true;

    const { travel } = getSlideMetrics();
    const current = texts[active];
    const next = texts[1 - active];

    next.classList.add('is-hidden');
    setTransform(next, -travel, false);
    next.offsetHeight;

    setTransform(current, travel, true);
    setTransform(next, 0, true);

    setTimeout(() => finishSlide(current, next, travel), duration);
  }

    isHovered = true;
    slide();
  });

    isHovered = false;
    if (!busy) reset();
  });

    element: btn,
    texts,
    setLabel(label) {
      texts.forEach((el) => {
        el.textContent = label;
      });
      if (!busy) reset();
    },
    applyStyles(styles = {}) {
      if (styles.background != null) btn.style.background = styles.background;
      if (styles.borderRadius != null) btn.style.borderRadius = styles.borderRadius;
      if (styles.border != null) btn.style.border = styles.border;
      if (styles.height != null) btn.style.height = styles.height;
      if (styles.width != null) btn.style.width = styles.width;
      if (styles.padding != null) btn.style.padding = styles.padding;
      if (!busy) reset();
    },
    setAnimation({ slideGap: gap, duration: ms, easingRaw: easing } = {}) {
      if (gap != null) slideGap = gap;
      if (ms != null) duration = ms;
      if (easing != null) easingRaw = easing;
      if (!busy) reset();
    },
    reset,
    getSlideMetrics,
  };
};

    if (data.paddingTop != null) controls.paddingTop.value = data.paddingTop;
    if (data.paddingRight != null) controls.paddingRight.value = data.paddingRight;
    if (data.paddingBottom != null) controls.paddingBottom.value = data.paddingBottom;
    if (data.paddingLeft != null) controls.paddingLeft.value = data.paddingLeft;
    if (data.border != null) controls.border.value = data.border;

  }

  function generateSnippet() {
    const config = getConfig();
    const label = utils.escapeHtml(config.label);
    const easingRaw = easing.getRaw() || '0.7, 0, 0.25, 1';
    const widthCss = config.width.toLowerCase() === 'auto'
      ? 'auto'
      : `${utils.parsePx(config.width, 0)}px`;
    const heightCss = config.height.toLowerCase() === 'auto'
      ? 'auto'
      : `${utils.parsePx(config.height, 56)}px`;

    return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hover Button</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    button {
      width: ${widthCss};
      padding: ${config.paddingTop}px ${config.paddingRight}px ${config.paddingBottom}px ${config.paddingLeft}px;
      font-size: 16px;
      border: ${config.borderCss};
      border-radius: ${config.radius}px;
      background: ${config.bg};
      height: ${heightCss};
      cursor: pointer;
      overflow: hidden;
      color: #000;
    }

    .label {
      display: block;
      position: relative;
      height: 1.125em;
    }

    .text {
      display: block;
      will-change: transform;
      white-space: nowrap;
    }

    .text.is-hidden {
      position: absolute;
      top: 0;
      left: 0;
    }
  </style>
</head>
<body>
  <button id="btn" type="button">
    <span class="label">
      <span class="text">${label}</span>
      <span class="text is-hidden">${label}</span>
    </span>
  </button>

  <script>
    const CONFIG = {
      slideGap: ${config.slideGap},
      duration: ${config.duration},
      easingRaw: ${JSON.stringify(easingRaw)},
    };

    const btn = document.getElementById('btn');
    const texts = btn.querySelectorAll('.text');
    let active = 0;
    let busy = false;
    let isHovered = false;

    btn.addEventListener('mouseenter', () => {
      isHovered = true;
      slide();
    });

    btn.addEventListener('mouseleave', () => {
      isHovered = false;
      if (!busy) reset();
    });

    reset();

    function getEasing() {
      const raw = CONFIG.easingRaw.trim();
      if (!raw) return 'cubic-bezier(0.7, 0, 0.25, 1)';
      if (raw.startsWith('cubic-bezier(')) return raw;

      const parts = raw.split(',').map((n) => parseFloat(n.trim()));
      if (parts.length === 4 && parts.every((n) => Number.isFinite(n))) {
        return 'cubic-bezier(' + parts.join(', ') + ')';
      }

      return raw;
    }

    function getSlideMetrics() {
      const labelWidth = texts[active].offsetWidth;
      const travel = labelWidth + CONFIG.slideGap;
      return { travel };
    }

    function reset() {
      const { travel } = getSlideMetrics();
      busy = false;
      active = 0;
      texts[0].classList.remove('is-hidden');
      texts[1].classList.add('is-hidden');
      setTransform(texts[0], 0, false);
      setTransform(texts[1], -travel, false);
    }

    function finishSlide(current, next, travel) {
      setTransform(current, -travel, false);
      current.classList.add('is-hidden');
      next.classList.remove('is-hidden');
      active = 1 - active;
      busy = false;
      if (!isHovered) reset();
    }

    function slide() {
      if (busy) return;
      busy = true;

      const { travel } = getSlideMetrics();
      const current = texts[active];
      const next = texts[1 - active];

      next.classList.add('is-hidden');
      setTransform(next, -travel, false);
      next.offsetHeight;

      setTransform(current, travel, true);
      setTransform(next, 0, true);

      setTimeout(() => finishSlide(current, next, travel), CONFIG.duration);
    }

    function setTransform(el, x, animate) {
      el.style.transition = animate
        ? 'transform ' + CONFIG.duration + 'ms ' + getEasing()
        : 'none';
      el.style.transform = 'translateX(' + x + 'px)';
    }
  <\/script>
</body>
</html>`;
  }

  preview.dataset.experimentReady = '1';
};

if (!document.getElementById('experiment-selector-root')) {
  window.initTooltip?.(document);
  window.initHoverButtonExperiment();
}

  </script>
</body>
</html>
